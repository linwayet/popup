<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中壢高中單字本｜字彙字識 1-1</title>
  <style>
    :root{--bg:#f8f1e6;--paper:#fffaf2;--ink:#3d2d22;--red:#a33d2e;--orange:#d96b27;--gold:#e2a83b;--green:#547a55;--purple:#76518f;--line:#e6cba5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(135deg,#f8ead8,#f6f1e8 45%,#f3e3d2);color:var(--ink);font-family:"BIZ UDPGothic","Noto Sans TC","PingFang TC",Arial,sans-serif;font-size:22px;line-height:1.8}
    header,main{width:min(920px,calc(100% - 28px));margin:auto}header{padding:42px 0 24px;text-align:center}h1{margin:0;padding:22px;border:3px solid #d88b64;border-radius:24px;background:#fff8ee;color:var(--red);font-size:clamp(2.25rem,7vw,3.5rem);line-height:1.25;box-shadow:0 10px 28px #89532c20}header p{margin:18px 0 0;color:#76533d;font-size:1.15rem;font-weight:700}
    nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 28px}nav a{display:flex;align-items:center;justify-content:center;min-height:72px;padding:12px;border-radius:16px;color:#fffaf2;text-decoration:none;font-weight:800;background:var(--green)}nav a:nth-child(2){background:var(--orange)}nav a:nth-child(3){background:var(--purple)}nav a:nth-child(4){background:#9b623f}
    section{scroll-margin-top:18px}.card{position:relative;margin:0 0 24px;padding:26px 28px 24px;border:2px solid var(--line);border-left:10px solid var(--orange);border-radius:20px;background:var(--paper);box-shadow:0 8px 22px #79512618}.card:nth-child(3n+2){border-left-color:var(--green)}.card:nth-child(3n){border-left-color:var(--purple)}
    h2{margin:0 0 8px;color:var(--red);font-size:1.48rem;line-height:1.45}.phonetic{color:#6c4937;font-weight:700}.pos{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:9px;background:#f1dfbe;color:#68401e;font-size:.94em}.related{margin:12px 0 14px;padding:12px 16px;border-radius:13px;background:#f7ead4;color:#4e3a2a}.label{color:#8d3c2e;font-weight:900}.examples{margin:0;padding-left:1.55em}.examples li{margin:7px 0}.zh{display:block;color:#6c5747;font-size:.92em}.top{display:inline-flex;align-items:center;justify-content:center;min-height:58px;margin-top:16px;padding:5px 18px;border-radius:14px;background:#efe0ca;color:#684b36;text-decoration:none;font-weight:800}
    .note{margin:30px 0 50px;padding:18px 22px;border-radius:18px;background:#f5dfc0;border:2px dashed #cf8d4b;color:#67442c}
    @media(max-width:650px){body{font-size:20px}header,main{width:min(100% - 18px,920px)}header{padding-top:20px}nav{grid-template-columns:1fr 1fr}.card{padding:21px 18px}h2{font-size:1.3rem}}
    @media print{body{background:#fff}.card{break-inside:avoid;box-shadow:none}nav,.top{display:none}}
  </style>
</head>
<body>
  <header id="top"><h1>中壢高中單字本</h1><p>字彙字識 1-1｜KK 音標・衍生詞與慣用語・實用例句</p></header>
  <main>
    <nav aria-label="單字導覽"><a href="#group-a">A–B</a><a href="#group-c1">C（前）</a><a href="#group-c2">C（後）</a><a href="#group-d">D</a></nav>
    <div id="cards"></div>
    <p class="note">音標採美式 KK 標示；例句以常見、自然且適合高中程度的用法為主。</p>
  </main>
  <script>
  const words = [
    ['group-a','Aboard','əˈbord','adv./prep. 在船、飛機或車上','go aboard','go əˈbord','登上交通工具','All passengers went aboard the plane before noon.','所有乘客都在中午前登上飛機。','Welcome aboard! We hope you enjoy the journey.','歡迎上車！希望您旅途愉快。'],
    ['','Airline','ˈɛrˌlaɪn','n. 航空公司','airline ticket','ˈɛrˌlaɪn ˈtɪkɪt','飛機票','The airline added a direct flight to Osaka.','這家航空公司新增了直飛大阪的航班。','We compared several airline tickets online.','我們在網路上比較了幾張機票。'],
    ['','Alcohol','ˈælkəˌhɔl','n. 酒精；酒','alcoholic','ˌælkəˈhɔlɪk','adj. 含酒精的','This medicine does not contain alcohol.','這種藥不含酒精。','Alcoholic drinks are not sold to minors.','含酒精飲料不得販售給未成年人。'],
    ['','Allowance','əˈlaʊəns','n. 零用錢；津貼','monthly allowance','ˈmʌnθlɪ əˈlaʊəns','每月零用錢／津貼','Mia saves part of her weekly allowance.','米婭會存下部分每週零用錢。','The company provides a monthly travel allowance.','公司每月提供交通津貼。'],
    ['','Almond','ˈɑmənd','n. 杏仁','almond milk','ˈɑmənd mɪlk','杏仁奶','She added sliced almonds to the salad.','她在沙拉裡加入杏仁片。','Almond milk is a popular dairy-free drink.','杏仁奶是很受歡迎的無乳製飲品。'],
    ['','Ambulance','ˈæmbjələns','n. 救護車','call an ambulance','kɔl ən ˈæmbjələns','叫救護車','Someone called an ambulance after the accident.','事故發生後，有人叫了救護車。','The ambulance arrived within ten minutes.','救護車在十分鐘內抵達。'],
    ['','Automobile','ˈɔtəmoˌbil','n. 汽車','automobile industry','ˈɔtəmoˌbil ˈɪndəstrɪ','汽車產業','The automobile changed modern transportation.','汽車改變了現代交通。','The automobile industry is developing electric vehicles.','汽車產業正在發展電動車。'],
    ['','Bacon','ˈbekən','n. 培根','bacon and eggs','ˈbekən ənd ɛgz','培根蛋','He ordered bacon and eggs for breakfast.','他早餐點了培根蛋。','The cook fried the bacon until it was crisp.','廚師把培根煎到酥脆。'],
    ['','Bargain','ˈbɑrgən','n. 便宜貨；v. 討價還價','a real bargain','ə ˈriəl ˈbɑrgən','非常划算的商品','This winter coat was a real bargain.','這件冬季外套買得非常划算。','Tourists often bargain with sellers at the market.','遊客常在市場和賣家討價還價。'],
    ['','Bitter','ˈbɪtɚ','adj. 苦的；痛苦的','bitterness','ˈbɪtɚnɪs','n. 苦味；怨恨','The medicine left a bitter taste in my mouth.','這藥在我嘴裡留下苦味。','She spoke without bitterness about the defeat.','她談到那次失敗時沒有怨恨。'],
    ['','Blouse','blaʊs','n. 女襯衫','silk blouse','sɪlk blaʊs','絲質女襯衫','She wore a white blouse to the interview.','她穿白色女襯衫去面試。','This silk blouse should be washed by hand.','這件絲質女襯衫應該手洗。'],
    ['','Bookcase','ˈbʊkˌkes','n. 書櫃','wooden bookcase','ˈwʊdən ˈbʊkˌkes','木製書櫃','The dictionary is on the top shelf of the bookcase.','字典在書櫃最上層。','My father built a wooden bookcase for my room.','爸爸為我的房間做了一座木書櫃。'],
    ['','Brake','brek','n. 煞車；v. 煞車','brake suddenly','brek ˈsʌdənlɪ','突然煞車','The driver hit the brakes to avoid the dog.','駕駛踩煞車以避開那隻狗。','Do not brake suddenly on a wet road.','不要在濕滑路面突然煞車。'],
    ['','Brunch','brʌntʃ','n. 早午餐','have brunch','hæv brʌntʃ','吃早午餐','We had brunch at a café near the station.','我們在車站附近的咖啡館吃早午餐。','The hotel serves brunch until two o’clock.','這家飯店供應早午餐到兩點。'],
    ['','Buffet','bəˈfe','n. 自助餐','breakfast buffet','ˈbrɛkfəst bəˈfe','自助式早餐','The restaurant offers a seafood buffet on weekends.','這家餐廳週末供應海鮮自助餐。','Breakfast is served buffet-style in the dining room.','早餐在餐廳以自助餐形式供應。'],
    ['group-c1','Cabin','ˈkæbɪn','n. 小木屋；機艙','cabin crew','ˈkæbɪn kru','機艙服務人員','We stayed in a small cabin by the lake.','我們住在湖邊的一間小木屋。','The cabin crew asked everyone to fasten their seat belts.','機艙服務人員請所有人繫好安全帶。'],
    ['','Cabinet','ˈkæbənɪt','n. 櫥櫃；內閣','kitchen cabinet','ˈkɪtʃən ˈkæbənɪt','廚房櫥櫃','The plates are in the kitchen cabinet.','盤子放在廚房櫥櫃裡。','The president met with members of the cabinet.','總統與內閣成員會面。'],
    ['','Carriage','ˈkærɪdʒ','n. 車廂；四輪馬車','railway carriage','ˈrelˌwe ˈkærɪdʒ','火車車廂','Our seats are in the last railway carriage.','我們的座位在最後一節車廂。','A horse pulled the carriage through the old town.','一匹馬拉著馬車穿過老城。'],
    ['','Chew','tʃu','v. 咀嚼','chewing gum','ˈtʃuɪŋ gʌm','口香糖','Chew your food slowly before swallowing it.','吞嚥前要慢慢咀嚼食物。','Students may not chew gum in class.','學生上課時不可嚼口香糖。'],
    ['','Chimney','ˈtʃɪmnɪ','n. 煙囪','chimney smoke','ˈtʃɪmnɪ smok','煙囪冒出的煙','Smoke rose from the cottage chimney.','煙從小屋的煙囪升起。','The workers cleaned the chimney before winter.','工人在冬季前清理了煙囪。'],
    ['','Closet','ˈklɑzɪt','n. 壁櫥；衣櫃','walk-in closet','ˈwɔkˌɪn ˈklɑzɪt','步入式衣櫃','Hang your jacket in the closet.','把你的外套掛在衣櫃裡。','The apartment has a large walk-in closet.','這間公寓有大型步入式衣櫃。'],
    ['','Cocktail','ˈkɑkˌtel','n. 雞尾酒','cocktail party','ˈkɑkˌtel ˈpɑrtɪ','雞尾酒會','The bartender made a colorful fruit cocktail.','酒保調製了一杯色彩鮮豔的水果雞尾酒。','They met several clients at the cocktail party.','他們在雞尾酒會上見了幾位客戶。'],
    ['','Coconut','ˈkokəˌnʌt','n. 椰子','coconut oil','ˈkokəˌnʌt ɔɪl','椰子油','The vendor cut open a fresh coconut.','攤販切開一顆新鮮椰子。','Some people use coconut oil for cooking.','有些人使用椰子油烹調。'],
    ['','Collar','ˈkɑlɚ','n. 衣領；項圈','shirt collar','ʃɝt ˈkɑlɚ','襯衫領','He turned up his collar against the cold wind.','他豎起衣領抵擋寒風。','The shirt collar was too tight around his neck.','那件襯衫的領口在他脖子周圍太緊。'],
    ['','Costume','ˈkɑstum','n. 戲服；化裝服','costume party','ˈkɑstum ˈpɑrtɪ','化裝舞會','The actors changed costumes between scenes.','演員在場景之間更換戲服。','Ben dressed as a pirate for the costume party.','班在化裝舞會上扮成海盜。'],
    ['','Cottage','ˈkɑtɪdʒ','n. 鄉間小屋','country cottage','ˈkʌntrɪ ˈkɑtɪdʒ','鄉間小屋','They rented a cottage near the coast.','他們在海岸附近租了一間小屋。','Her grandparents live in a quiet country cottage.','她的祖父母住在一間安靜的鄉間小屋。'],
    ['group-c2','Crane','kren','n. 起重機；鶴','tower crane','ˈtaʊɚ kren','塔式起重機','A crane lifted the steel beam into place.','起重機把鋼梁吊到定位。','We saw a white crane standing beside the river.','我們看見一隻白鶴站在河邊。'],
    ['','Crispy','ˈkrɪspɪ','adj. 酥脆的','crisp','krɪsp','adj. 脆的；爽脆的','Bake the potatoes until they are crispy.','把馬鈴薯烤到酥脆。','The morning air was cool and crisp.','清晨的空氣涼爽清新。'],
    ['','Cupboard','ˈkʌbɚd','n. 碗櫥；食物櫃','kitchen cupboard','ˈkɪtʃən ˈkʌbɚd','廚房碗櫥','There are extra cups in the cupboard.','碗櫥裡有備用杯子。','She stored rice in the kitchen cupboard.','她把米存放在廚房食物櫃裡。'],
    ['group-d','Dairy','ˈdɛrɪ','adj. 乳製的；n. 乳製品','dairy products','ˈdɛrɪ ˈprɑdəkts','乳製品','Milk and cheese are common dairy products.','牛奶和起司是常見乳製品。','This café has several dairy-free options.','這家咖啡館有幾種不含乳製品的選擇。'],
    ['','Depart','dɪˈpɑrt','v. 離開；出發','depart from','dɪˈpɑrt frəm','從……出發','The train will depart at 8:15.','火車將在八點十五分出發。','Our flight departs from Gate 12.','我們的班機從十二號登機門出發。'],
    ['','Departure','dɪˈpɑrtʃɚ','n. 離開；出發','departure time','dɪˈpɑrtʃɚ taɪm','出發時間','Please check the departure time on your ticket.','請查看票上的出發時間。','Her sudden departure surprised the whole team.','她突然離開讓整個團隊很驚訝。'],
    ['','Dessert','dɪˈzɝt','n. 甜點','dessert menu','dɪˈzɝt ˈmɛnju','甜點菜單','We shared a chocolate cake for dessert.','我們一起分享巧克力蛋糕作為甜點。','The server brought us the dessert menu.','服務生拿來甜點菜單。'],
    ['','Dine','daɪn','v. 用餐','dine out','daɪn aʊt','外出用餐','We usually dine at home on weekdays.','我們平日通常在家用餐。','Many families dine out during the holiday.','許多家庭在假日期間外出用餐。']
  ];
  const root=document.getElementById('cards'); let group='';
  words.forEach((w,i)=>{if(w[0]){group=w[0];const s=document.createElement('section');s.id=group;root.appendChild(s)}const host=root.lastElementChild;const a=document.createElement('article');a.className='card';a.innerHTML=`<h2>${i+1}. ${w[1]} <span class="phonetic">[${w[2]}]</span> <span class="pos">${w[3]}</span></h2><p class="related"><span class="label">常用延伸：</span>${w[4]} <span class="phonetic">[${w[5]}]</span>（${w[6]}）</p><ol class="examples"><li>${w[7]}<span class="zh">${w[8]}</span></li><li>${w[9]}<span class="zh">${w[10]}</span></li></ol><a class="top" href="#top">⬆ 回到頂端</a>`;host.appendChild(a)});
  </script>
</body>
</html>
