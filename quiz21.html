<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader — HD, No Watermark, MP3</title>
<style>
  :root{
    --cyan:#25F4EE; --pink:#FE2C55; --bg:#0e0e12; --card:#17171f;
    --line:#2a2a35; --text:#f2f2f5; --muted:#9a9aa8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b1b26,var(--bg)); color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:520px}
  h1{
    font-size:28px; text-align:center; margin:0 0 6px; letter-spacing:-.5px;
  }
  h1 .a{color:var(--cyan)} h1 .b{color:var(--pink)}
  .sub{text-align:center; color:var(--muted); font-size:14px; margin:0 0 26px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .field{display:flex; gap:8px; margin-bottom:14px}
  input[type=url]{
    flex:1; background:#0c0c11; border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-size:15px; padding:14px 14px; outline:none;
  }
  input[type=url]:focus{border-color:var(--cyan)}
  .paste{
    background:#0c0c11; border:1px solid var(--line); border-radius:12px; color:var(--muted);
    padding:0 14px; cursor:pointer; font-size:13px; white-space:nowrap;
  }
  .paste:hover{color:var(--text); border-color:var(--cyan)}
  .btns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  button.dl{
    border:0; border-radius:12px; padding:15px 12px; font-size:15px; font-weight:600;
    cursor:pointer; color:#0b0b0f; display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:transform .06s ease, filter .15s ease;
  }
  button.dl small{font-weight:500; font-size:11px; opacity:.7}
  button.dl:hover{filter:brightness(1.08)}
  button.dl:active{transform:translateY(1px)}
  button.dl:disabled{filter:grayscale(.6) brightness(.7); cursor:not-allowed}
  .hd{background:linear-gradient(135deg,var(--cyan),#8ef7f2)}
  .mp3{background:linear-gradient(135deg,var(--pink),#ff7a97)}
  .preview{
    display:none; margin-top:18px; padding-top:18px; border-top:1px solid var(--line);
    gap:12px; align-items:center;
  }
  .preview.show{display:flex}
  .preview img{width:64px; height:84px; object-fit:cover; border-radius:10px; background:#000; flex:none}
  .preview .meta{min-width:0}
  .preview .t{font-size:14px; font-weight:600; line-height:1.3; margin:0 0 4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .preview .u{font-size:12px; color:var(--muted); margin:0}
  .msg{margin-top:14px; font-size:13px; text-align:center; min-height:18px}
  .msg.err{color:#ff8095} .msg.ok{color:var(--cyan)}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{text-align:center; color:var(--muted); font-size:11px; margin-top:20px; line-height:1.6}
</style>
</head>
<body>
  <div class="wrap">
    <h1><span class="a">TikTok</span> <span class="b">Downloader</span></h1>
    <p class="sub">Paste a link — get HD (no watermark) or MP3.</p>

    <div class="card">
      <div class="field">
        <input id="url" type="url" placeholder="https://www.tiktok.com/@user/video/…"
               autocomplete="off" spellcheck="false">
        <button class="paste" id="pasteBtn" title="Paste from clipboard">Paste</button>
      </div>

      <div class="btns">
        <button class="dl hd" id="hdBtn" onclick="download('video')">
          Download HD <small>No watermark</small>
        </button>
        <button class="dl mp3" id="mp3Btn" onclick="download('mp3')">
          Download MP3 <small>Audio only</small>
        </button>
      </div>

      <div class="preview" id="preview">
        <img id="thumb" alt="">
        <div class="meta">
          <p class="t" id="pTitle"></p>
          <p class="u" id="pUser"></p>
        </div>
      </div>

      <div class="msg" id="msg"></div>
    </div>

    <p class="foot">
      Runs locally via yt-dlp + ffmpeg.<br>
      Use for your own or permitted content only.
    </p>
  </div>

<script>
const $ = id => document.getElementById(id);
const urlEl = $('url'), msgEl = $('msg'), preview = $('preview');
let busy = false, infoTimer = null;

function setMsg(text, cls=''){ msgEl.className = 'msg ' + cls; msgEl.innerHTML = text; }
function setBusy(state){
  busy = state;
  $('hdBtn').disabled = state; $('mp3Btn').disabled = state;
}

// Paste from clipboard
$('pasteBtn').addEventListener('click', async () => {
  try { urlEl.value = (await navigator.clipboard.readText()).trim(); onUrlChange(); urlEl.focus(); }
  catch { setMsg('Clipboard blocked — paste manually (Ctrl/Cmd+V).', 'err'); }
});

// Debounced preview fetch
urlEl.addEventListener('input', onUrlChange);
function onUrlChange(){
  clearTimeout(infoTimer);
  const v = urlEl.value.trim();
  preview.classList.remove('show');
  if (!/tiktok\.com/i.test(v)) { setMsg(''); return; }
  infoTimer = setTimeout(fetchInfo, 500);
}

async function fetchInfo(){
  const url = urlEl.value.trim();
  try {
    const r = await fetch('/api/info', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not read video.');
    $('thumb').src = d.thumbnail || '';
    $('pTitle').textContent = d.title || 'TikTok video';
    $('pUser').textContent = d.uploader ? '@' + d.uploader : '';
    preview.classList.add('show');
    setMsg('');
  } catch(e){ /* silent — preview is optional */ }
}

async function download(type){
  if (busy) return;
  const url = urlEl.value.trim();
  if (!/tiktok\.com/i.test(url)) { setMsg('Paste a valid TikTok link first.', 'err'); return; }

  setBusy(true);
  setMsg('<span class="spin"></span>' + (type==='mp3' ? 'Extracting audio…' : 'Fetching HD video…'));

  try {
    const r = await fetch(`/api/download?type=${type}&url=${encodeURIComponent(url)}`);
    if (!r.ok) {
      let err = 'Download failed.';
      try { err = (await r.json()).error || err; } catch {}
      throw new Error(err);
    }
    // Filename from Content-Disposition, fallback otherwise
    let name = type==='mp3' ? 'tiktok.mp3' : 'tiktok.mp4';
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    if (m) name = decodeURIComponent(m[1]);

    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    setMsg('Saved ✓ (' + name + ')', 'ok');
  } catch(e){
    setMsg(e.message, 'err');
  } finally {
    setBusy(false);
  }
}

// Enter key = HD download
urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') download('video'); });
</script>
</body>
</html>
